# Render Blueprint: one web service (API + React app, built from the Dockerfile)
# and one managed Postgres database. Set up once from the Render dashboard
# (see docs/deploy/render-setup.md). After that, every push to main redeploys.
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ajaia-doc-editor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true
    # "/" returns index.html, so a passing check means the frontend is served too.
    healthCheckPath: /
    domains:
      - ajaia.nickesqueda.com
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-db
          property: connectionString
      # Generated by Render on first deploy and never stored in git.
      # The demo users' password is SEED_PASSWORD: read it in the service's Environment tab.
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true

databases:
  - name: ajaia-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    databaseName: doc_editor
    user: doc_editor
    # No outside access: only services in this Render account can connect.
    ipAllowList: []
