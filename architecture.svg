<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Ajaia Doc Editor architecture: web, API and database tiers</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#ffffff"/>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#1f2328">Ajaia Doc Editor architecture</text>
  <text x="40" y="82" font-size="15" fill="#57606a">One domain for the app and the API, so the session cookie is first-party and there is no CORS.</text>

  <!-- Tier headings -->
  <text x="40" y="132" font-size="13" font-weight="700" fill="#0969da" letter-spacing="1.5">WEB TIER</text>
  <text x="440" y="132" font-size="13" font-weight="700" fill="#8250df" letter-spacing="1.5">API TIER</text>
  <text x="840" y="132" font-size="13" font-weight="700" fill="#1a7f37" letter-spacing="1.5">DATABASE TIER</text>

  <!-- Web tier -->
  <rect x="40" y="148" width="320" height="330" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="64" y="184" font-size="18" font-weight="700" fill="#1f2328">Browser</text>
  <text x="64" y="208" font-size="14" fill="#57606a">React + TypeScript single-page app</text>
  <rect x="60" y="228" width="280" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="254" font-size="14" font-weight="600" fill="#1f2328">Document list</text>
  <text x="76" y="276" font-size="13" fill="#57606a">Owned and shared docs, upload</text>
  <rect x="60" y="304" width="280" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="330" font-size="14" font-weight="600" fill="#1f2328">Tiptap editor</text>
  <text x="76" y="352" font-size="13" fill="#57606a">Rich text, autosave, share dialog</text>
  <text x="64" y="404" font-size="13" fill="#57606a">Built by Vite. In production the files</text>
  <text x="64" y="424" font-size="13" fill="#57606a">come from Express, on the same domain.</text>
  <text x="64" y="456" font-size="13" font-weight="600" fill="#0969da">ajaia.nickesqueda.com</text>

  <!-- API tier -->
  <rect x="440" y="148" width="320" height="330" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="464" y="184" font-size="18" font-weight="700" fill="#1f2328">Render web service</text>
  <text x="464" y="208" font-size="14" fill="#57606a">One Docker container, Node 22, Express 5</text>
  <rect x="460" y="228" width="280" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="476" y="254" font-size="14" font-weight="600" fill="#1f2328">/api routes (JSON)</text>
  <text x="476" y="278" font-size="13" fill="#57606a">/api/auth: login, logout, session</text>
  <text x="476" y="300" font-size="13" fill="#57606a">/api/documents: edit, share, import</text>
  <text x="476" y="322" font-size="13" fill="#57606a">/api/users: people to share with</text>
  <rect x="460" y="358" width="280" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="476" y="384" font-size="14" font-weight="600" fill="#1f2328">Every other path</text>
  <text x="476" y="406" font-size="13" fill="#57606a">Serves the React build</text>
  <text x="464" y="456" font-size="13" fill="#57606a">Runs migrations and the seed on start.</text>

  <!-- Database tier -->
  <rect x="840" y="148" width="320" height="330" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="864" y="184" font-size="18" font-weight="700" fill="#1f2328">Render Postgres 16</text>
  <text x="864" y="208" font-size="14" fill="#57606a">Managed database, no outside access</text>
  <rect x="860" y="228" width="280" height="194" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="876" y="254" font-size="14" font-weight="600" fill="#1f2328">Tables</text>
  <text x="876" y="290" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">users</text>
  <text x="1014" y="290" font-size="13" fill="#57606a">Demo accounts</text>
  <text x="876" y="324" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">session</text>
  <text x="1014" y="324" font-size="13" fill="#57606a">Login sessions</text>
  <text x="876" y="358" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">documents</text>
  <text x="1014" y="358" font-size="13" fill="#57606a">Tiptap JSON</text>
  <text x="876" y="392" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">document_access</text>
  <text x="1014" y="392" font-size="13" fill="#57606a">Who can open it</text>
  <text x="864" y="456" font-size="13" fill="#57606a">Region: Ohio, same as the web service.</text>

  <!-- Arrows: web to API -->
  <line x1="362" y1="270" x2="436" y2="270" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="399" y="258" font-size="12" fill="#57606a" text-anchor="middle">HTTPS</text>
  <text x="399" y="290" font-size="12" fill="#57606a" text-anchor="middle">/api/*</text>
  <line x1="438" y1="390" x2="364" y2="390" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="399" y="410" font-size="12" fill="#57606a" text-anchor="middle">app files</text>

  <!-- Arrow: API to database -->
  <line x1="762" y1="310" x2="836" y2="310" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="799" y="298" font-size="12" fill="#57606a" text-anchor="middle">SQL (pg)</text>
  <text x="799" y="330" font-size="12" fill="#57606a" text-anchor="middle">private</text>

  <!-- Local development -->
  <rect x="40" y="512" width="1120" height="108" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="64" y="546" font-size="16" font-weight="700" fill="#1f2328">Running locally with docker compose</text>
  <text x="64" y="574" font-size="14" fill="#57606a">The same three tiers run as containers: the Vite dev server on :5173 serves the app and forwards /api to</text>
  <text x="64" y="598" font-size="14" fill="#57606a">Express on :3000, which talks to Postgres on :5432. The session cookie is signed with SESSION_SECRET from .env.</text>
</svg>
